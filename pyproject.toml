[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-releaseletter"
version = "0.1.0"
description = "Jira-Export bereinigen, Release-Tickets abgleichen, Release-Dokumente erzeugen"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "fpdf2>=2.7",
    "markdown>=3.6",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
]

[project.scripts]
jira-releaseletter = "jira_releaseletter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jira_releaseletter = ["templates/*.j2"]
